<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>PHOENIX DONAT SHOP</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link
        rel="stylesheet"
        href="/style.css?v=1"
    >
</head>

<body>

<div id="app">

    <!-- HEADER -->
    <header class="top-header">

        <div class="profile-mini">

            <div
                class="avatar"
                id="userAvatar"
            >
                🔥
            </div>

            <div>
                <div
                    class="user-name"
                    id="userName"
                >
                    PHOENIX USER
                </div>

                <div
                    class="user-username"
                    id="userUsername"
                >
                    @username
                </div>
            </div>

        </div>

        <button
            class="notification-btn"
            onclick="openNotifications()"
        >
            🔔
        </button>

    </header>


    <!-- BALANCE -->
    <section class="balance-card">

        <div>
            <div class="balance-title">
                Mening balansim
            </div>

            <div
                class="balance-value"
                id="balanceValue"
            >
                0 UZS
            </div>
        </div>

        <button
            class="balance-button"
            onclick="openBalance()"
        >
            + To‘ldirish
        </button>

    </section>

<section class="balance-card">

    <div>
        <div class="balance-title">
            PlayPay balans
        </div>

        <div
            class="balance-value"
            id="playpayBalanceValue"
        >
            Yuklanmoqda...
        </div>
    </div>

</section>
    <!-- HERO -->
    <section class="hero">

        <div class="hero-glow"></div>

        <div class="hero-content">

            <div class="hero-small">
                PHOENIX DONAT SHOP
            </div>

            <h1>
                GAME<br>
                <span>TOP-UP</span>
            </h1>

            <p>
                Tezkor • Ishonchli • Qulay
            </p>

            <button
                class="hero-button"
                onclick="openDiamonds()"
            >
                💎 Donat qilish
            </button>

        </div>

        <div class="hero-character">
            🪽
        </div>

    </section>


    <!-- CATEGORIES -->
    <section class="section">

        <div class="section-header">

            <h2>
                Kategoriyalar
            </h2>

            <span>
                Barchasi
            </span>

        </div>


        <div class="category-grid">

            <button
                class="category-card mlbb"
                onclick="openDiamonds()"
            >

                <div class="category-image">
                    💎
                </div>

                <div class="category-name">
                    Mobile Legends
                </div>

                <div class="category-sub">
                    Diamonds
                </div>

            </button>


            <button
                class="category-card boost"
                onclick="openBoost()"
            >

                <div class="category-image">
                    🚀
                </div>

                <div class="category-name">
                    Boost
                </div>

                <div class="category-sub">
                    Rank xizmatlari
                </div>

            </button>


            <button
                class="category-card accounts"
                onclick="openAccounts()"
            >

                <div class="category-image">
                    🎮
                </div>

                <div class="category-name">
                    Accountlar
                </div>

                <div class="category-sub">
                    Marketplace
                </div>

            </button>


            <button
                class="category-card balance"
                onclick="openBalance()"
            >

                <div class="category-image">
                    💳
                </div>

                <div class="category-name">
                    Balans
                </div>

                <div class="category-sub">
                    Hisobni to‘ldirish
                </div>

            </button>

        </div>

    </section>


    <!-- PROMO -->
    <section class="promo-banner">

        <div>

            <div class="promo-label">
                MAXSUS TAKLIF
            </div>

            <div class="promo-title">
                Promo koddan foydalaning
            </div>

            <div class="promo-text">
                Xaridingizga chegirma oling
            </div>

        </div>

        <div class="promo-icon">
            🎁
        </div>

    </section>


    <!-- QUICK MENU -->
    <section class="section">

        <div class="section-header">

            <h2>
                Tezkor
            </h2>

        </div>


        <div class="quick-grid">

            <button
                onclick="openOrders()"
                class="quick-card"
            >
                <span>📦</span>
                <b>Buyurtmalar</b>
                <small>Tarix</small>
            </button>


            <button
                onclick="openPromo()"
                class="quick-card"
            >
                <span>🎁</span>
                <b>Promo kod</b>
                <small>Chegirma</small>
            </button>


            <button
                onclick="openSupport()"
                class="quick-card"
            >
                <span>🆘</span>
                <b>Yordam</b>
                <small>Support</small>
            </button>


            <button
                onclick="openProfile()"
                class="quick-card"
            >
                <span>👤</span>
                <b>Profil</b>
                <small>Sozlamalar</small>
            </button>

        </div>

    </section>


    <!-- CONTENT AREA -->
    <main id="contentArea"></main>


    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">

        <button
            class="nav-item active"
            onclick="goHome()"
        >
            <span>🏠</span>
            <small>Bosh sahifa</small>
        </button>


        <button
            class="nav-item"
            onclick="openOrders()"
        >
            <span>📦</span>
            <small>Faoliyat</small>
        </button>


        <button
            class="nav-center"
            onclick="openDiamonds()"
        >
            +
        </button>


        <button
            class="nav-item"
            onclick="openNotifications()"
        >
            <span>💬</span>
            <small>Xabar</small>
        </button>


        <button
            class="nav-item"
            onclick="openProfile()"
        >
            <span>👤</span>
            <small>Profil</small>
        </button>

    </nav>

</div>


<!-- MODAL -->
<div
    class="modal"
    id="modal"
>

    <div
        class="modal-background"
        onclick="closeModal()"
    ></div>

    <div class="modal-box">

        <button
            class="modal-close"
            onclick="closeModal()"
        >
            ×
        </button>

        <div id="modalContent"></div>

    </div>

</div>


<script src="/app.js?v=1"></script>

</body>
                                  </html>
